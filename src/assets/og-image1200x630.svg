<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      @font-face {
        font-family: 'Geist Mono';
        src: url('../../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      .sans { font-family: 'Geist', system-ui, sans-serif; }
      .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
    </style>
    <radialGradient id="glow" cx="600" cy="-76" r="760" gradientUnits="userSpaceOnUse" gradientTransform="matrix(1 0 0 0.42 0 -44)">
      <stop offset="0" stop-color="#2f4a5c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f4a5c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="avatar">
      <circle cx="170" cy="270" r="90"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#0c0e14"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <image href="../../public/photo1.jpg" xlink:href="../../public/photo1.jpg" x="80" y="180" width="180" height="180" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar)"/>
  <text class="sans" x="304" y="262" font-size="72" font-weight="500" letter-spacing="-2" fill="#f5f6f8">Matthew B. Smith</text>
  <text class="sans" x="306" y="322" font-size="34" font-weight="400" fill="#a6abb8">Senior Software Engineer</text>

  <line x1="80" y1="450" x2="1120" y2="450" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <text class="mono" x="80" y="504" font-size="24" fill="#8b90a0">Somerset, KY</text>
  <text class="mono" x="1120" y="504" text-anchor="end" font-size="24" fill="#7ec8ea">matthewbsmith.com</text>
